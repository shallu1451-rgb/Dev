<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Package Details | Dev Tour and Travels</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/package-detail.css">
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const pkgId = params.get("id");
      if (pkgId && typeof TOURS_DATA !== "undefined") {
        const pkg = TOURS_DATA.find(p => p.id === pkgId);
        if (pkg && pkg.pageUrl) {
          window.location.replace(pkg.pageUrl);
          return;
        }
      }
      // If no ID or not found, redirect to catalog
      window.location.replace("index.html#packagesCatalogSection");
    });
  </script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; font-family:'Plus Jakarta Sans',sans-serif;">
  <div style="background:#fff; padding:40px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); max-width:480px;">
    <div style="width:60px; height:60px; border-radius:50%; background:#e6f7f5; display:inline-flex; align-items:center; justify-content:center; color:#00a896; font-size:24px; margin-bottom:16px;">
      <i class="fa fa-compass"></i>
    </div>
    <h2 style="color:#054a68; margin-bottom:10px;">Loading Package...</h2>
    <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Redirecting you to the dedicated package page.</p>
    <a href="index.html" class="btn-custom btn-primary-custom" style="display:inline-block; padding:10px 20px; background:#054a68; color:#fff; border-radius:8px; text-decoration:none;">View All Packages</a>
  </div>
</body>
</html>
